# ─── SharaSpot Local Docker Compose ───
#
# Usage:
#   1. Copy .env.example files and fill in values
#   2. docker compose -f docker-compose.local.yml up -d --build
#
# Services:
#   - PostgreSQL 16 (local database)
#   - Redis 7 (cache + queues)
#   - SharaSpot API (Express server, with auto-migration and seeding)
#   - SharaSpot Worker (email processing + reply detection)
#   - SharaSpot Frontend (Next.js)
#   - Nginx (reverse proxy for local routing on http://localhost)
#

services:
  postgres:
    image: postgres:16-alpine
    container_name: sharaspot-db-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: sharaspot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: sharaspot
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharaspot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sharaspot-redis-local
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data_local:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    container_name: sharaspot-api-local
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://sharaspot:${DB_PASSWORD:-changeme}@sharaspot-db-local:5432/sharaspot
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@sharaspot-redis-local:6379
      NODE_ENV: production
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local_access_secret_key_123456789}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local_refresh_secret_key_123456789}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-local_admin_secret_key_123456789}
      ACCESS_TOKEN_EXPIRES: ${ACCESS_TOKEN_EXPIRES:-15m}
      REFRESH_TOKEN_EXPIRES: ${REFRESH_TOKEN_EXPIRES:-7d}
      JWT_SECRET: ${JWT_SECRET:-local_jwt_secret_key_1234567890123456}
      SESSION_SECRET: ${SESSION_SECRET:-local_session_secret_key_1234567890123456}
    # Automatically migrate and seed database before starting API
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/prisma/seed.js && node dist/index.js"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data_local:/app/uploads

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    container_name: sharaspot-worker-local
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://sharaspot:${DB_PASSWORD:-changeme}@sharaspot-db-local:5432/sharaspot
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@sharaspot-redis-local:6379
      NODE_ENV: production
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local_access_secret_key_123456789}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local_refresh_secret_key_123456789}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-local_admin_secret_key_123456789}
      ACCESS_TOKEN_EXPIRES: ${ACCESS_TOKEN_EXPIRES:-15m}
      REFRESH_TOKEN_EXPIRES: ${REFRESH_TOKEN_EXPIRES:-7d}
      JWT_SECRET: ${JWT_SECRET:-local_jwt_secret_key_1234567890123456}
      SESSION_SECRET: ${SESSION_SECRET:-local_session_secret_key_1234567890123456}
    command: ["node", "dist/worker/index.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.client
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-354664818470-veljl4900p28hf0i81u0r959ra11ihjt.apps.googleusercontent.com}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
    container_name: sharaspot-frontend-local
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: sharaspot-nginx-local
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/docker-nginx-local.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
      - frontend

volumes:
  postgres_data_local:
  redis_data_local:
  uploads_data_local:
