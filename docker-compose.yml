# ─── SharaSpot Docker Compose ───
#
# Usage:
#   1. Copy .env.example files and fill in values
#   2. docker compose up -d
#
# Services:
#   - PostgreSQL 16 (local database)
#   - Redis 7 (cache + queues)
#   - SharaSpot API (Express server)
#   - SharaSpot Worker (email processing + reply detection)
#   - SharaSpot Frontend (Next.js)
#   - Nginx (reverse proxy + SSL)
#
# Attachments are stored locally on the VPS filesystem and persisted via volumes.
# Database and Redis also run locally — zero cloud DB costs.

services:
  postgres:
    image: postgres:16-alpine
    container_name: sharaspot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sharaspot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: sharaspot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharaspot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sharaspot-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: ../deploy/Dockerfile.server
    container_name: sharaspot-api
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://sharaspot:${DB_PASSWORD:-changeme}@sharaspot-db:5432/sharaspot
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@sharaspot-redis:6379
      NODE_ENV: production
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  worker:
    build:
      context: ./server
      dockerfile: ../deploy/Dockerfile.server
    container_name: sharaspot-worker
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://sharaspot:${DB_PASSWORD:-changeme}@sharaspot-db:5432/sharaspot
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@sharaspot-redis:6379
      NODE_ENV: production
    command: ["node", "dist/worker/index.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ./client
      dockerfile: ../deploy/Dockerfile.client
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://sharaspot.in}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
    container_name: sharaspot-frontend
    restart: unless-stopped
    env_file:
      - ./client/.env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: sharaspot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/docker-nginx.conf:/etc/nginx/conf.d/default.conf
      - ./deploy/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
